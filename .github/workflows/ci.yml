name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Install from uv.lock rather than re-resolving. `pip install -e .[dev]`
      # picked the newest release of every `>=` dependency on each run, so CI
      # broke whenever an upstream package shipped a breaking change (e.g. the
      # starlette 0.52 -> 1.x TemplateResponse signature) while local venvs
      # stayed on older versions and reported green.
      - name: Install deps (locked)
        run: uv sync --extra dev --frozen

      # Fails if uv.lock has drifted from pyproject.toml, so the lock cannot
      # go stale silently.
      - name: Verify lockfile is current
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      # Matches `make lint`. CI previously ran only ruff, so formatting drift
      # went unnoticed until someone ran the Makefile target locally.
      - name: Format check
        run: uv run black --check .

      - name: Type-check
        run: uv run mypy app

      - name: Tests
        env:
          OMDB_API_KEY: dummy
        run: uv run pytest

  # Builds the production image on every run (so a broken Dockerfile fails the
  # PR), but only pushes it to GHCR for a green push to main.
  image:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the image exactly as production does (DEBUG off, so the startup
      # guards on SECRET_KEY and PUBLIC_BASE_URL apply) and require /healthz
      # to report ok. --network none proves the container needs nothing from
      # the internet to start: the model and embeddings must be in the image.
      - name: Smoke-test the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          docker run -d --name smoke --network none \
            -e DEBUG=false \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e PUBLIC_BASE_URL=https://example.com \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            "$IMAGE" uvicorn app.main:app --host 127.0.0.1 --port 8000
          probe='import json,urllib.request; print(json.load(urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=4)))'
          for i in $(seq 1 30); do
            body=$(docker exec smoke python -c "$probe" 2>/dev/null || true)
            if echo "$body" | grep -q "'status': 'ok'"; then break; fi
            sleep 3
          done
          echo "healthz: $body"
          uid=$(docker exec smoke id -u)
          echo "container uid: $uid"
          if ! echo "$body" | grep -q "'status': 'ok'" || [ "$uid" = "0" ]; then
            docker logs smoke 2>&1 | grep -v "Loading weights" | tail -40
            exit 1
          fi
          docker rm -f smoke >/dev/null

      - name: Push to GHCR
        if: github.event_name == 'push'
        run: docker push --all-tags ghcr.io/${{ github.repository }}

  # Ships the image just built to the Hetzner box. The server holds only
  # docker-compose.prod.yml, the Caddyfile and .env.prod (secrets); everything
  # else comes from this repository.
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      APP_DIR: /opt/terror-reco
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy compose file and Caddyfile
        run: scp docker-compose.prod.yml Caddyfile "deploy@$HOST:$APP_DIR/"

      # The job's own token authenticates the pull, so the server needs no
      # long-lived registry credential and the package can stay private.
      - name: Pull and restart
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh "deploy@$HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          ssh "deploy@$HOST" "cd $APP_DIR \
            && export IMAGE_TAG=${{ github.sha }} \
            && docker compose -f docker-compose.prod.yml --env-file .env.prod pull -q app \
            && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans \
            && sed -i '/^IMAGE_TAG=/d' .env.prod && echo IMAGE_TAG=${{ github.sha }} >> .env.prod \
            ; status=\$?; docker logout ghcr.io >/dev/null; docker image prune -af >/dev/null; exit \$status"

      # A deploy that leaves the site down must fail the run, not pass it.
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS -m 5 "${{ vars.DEPLOY_URL }}/healthz" || true)
            if echo "$body" | grep -q '"status":"ok"'; then echo "$body"; exit 0; fi
            sleep 5
          done
          echo "healthz never reported ok: $body"; exit 1
