name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Install from uv.lock rather than re-resolving. `pip install -e .[dev]`
      # picked the newest release of every `>=` dependency on each run, so CI
      # broke whenever an upstream package shipped a breaking change (e.g. the
      # starlette 0.52 -> 1.x TemplateResponse signature) while local venvs
      # stayed on older versions and reported green.
      - name: Install deps (locked)
        run: uv sync --extra dev --frozen

      # Fails if uv.lock has drifted from pyproject.toml, so the lock cannot
      # go stale silently.
      - name: Verify lockfile is current
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      # Matches `make lint`. CI previously ran only ruff, so formatting drift
      # went unnoticed until someone ran the Makefile target locally.
      - name: Format check
        run: uv run black --check .

      - name: Type-check
        run: uv run mypy app

      - name: Tests
        env:
          OMDB_API_KEY: dummy
        run: uv run pytest

      - name: Build Docker image
        run: docker build -t terror-reco:ci .
